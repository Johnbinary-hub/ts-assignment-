<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book CRUD App</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Book CRUD App</h1>

<h2>Add / Update Book</h2>
<input type="hidden" id="bookId">
<input type="text" id="title" placeholder="Title">
<input type="text" id="author" placeholder="Author">
<input type="number" id="price" placeholder="Price">
<button onclick="saveBook()">Save Book</button>

<h2>Books List</h2>
<table>
  <thead>
    <tr>
      <th>Title</th>
      <th>Author</th>
      <th>Price</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="booksTable"></tbody>
</table>

<script>
const API_URL = "http://localhost:5000/books"; // Your backend

// Fetch all books and display
async function fetchBooks() {
  const res = await fetch(API_URL);
  const books = await res.json();
  const table = document.getElementById("booksTable");
  table.innerHTML = "";
  books.forEach(book => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${book.title}</td>
      <td>${book.author}</td>
      <td>${book.price}</td>
      <td>
        <button onclick="editBook('${book._id}', '${book.title}', '${book.author}', ${book.price})">Edit</button>
        <button onclick="deleteBook('${book._id}')">Delete</button>
      </td>
    `;
    table.appendChild(row);
  });
}

// Add or update a book
async function saveBook() {
  const id = document.getElementById("bookId").value;
  const title = document.getElementById("title").value;
  const author = document.getElementById("author").value;
  const price = document.getElementById("price").value;

  if (!title || !author) {
    alert("Title and author are required!");
    return;
  }

  const bookData = { title, author, price: Number(price) };

  if (id) {
    // Update
    await fetch(`${API_URL}/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(bookData)
    });
  } else {
    // Create
    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(bookData)
    });
  }

  // Clear form
  document.getElementById("bookId").value = "";
  document.getElementById("title").value = "";
  document.getElementById("author").value = "";
  document.getElementById("price").value = "";

  fetchBooks();
}

// Delete a book
async function deleteBook(id) {
  if (confirm("Are you sure you want to delete this book?")) {
    await fetch(`${API_URL}/${id}`, { method: "DELETE" });
    fetchBooks();
  }
}

// Edit a book (populate form)
function editBook(id, title, author, price) {
  document.getElementById("bookId").value = id;
  document.getElementById("title").value = title;
  document.getElementById("author").value = author;
  document.getElementById("price").value = price;
}

// Initial fetch
fetchBooks();
</script>

</body>
</html>
